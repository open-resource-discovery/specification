policyId: sap:base:v1
slug: sap-base-v1
title: SAP Base Policy Level (v1.0)
shortTitle: SAP Base v1
description: SAP Base v1 policy level
sidebarPosition: 1
status: active
summary: |
  This policy level MUST be fulfilled by all SAP applications and services.
  It includes the **essential** validations that ensure proper metadata discovery and aggregation.

  Most SAP applications and services will instead use the more complete and opinionated [SAP Core v1](./sap-core-v1.md) policy level, which builds on this one.
rules:
  - id: policy-levels.custom-namespaced
    scope: propertyName
    propertyNames: [policyLevels]
    requirement: mandatory
    title: Custom policy levels must be namespaced
    note: |
      SAP applications and services MAY define custom policy levels, but they MUST be namespaced under their application-specific namespace, e.g. `sap.s4:core:v1`.

  - id: policy-levels.sap-namespace-reserved
    scope: propertyName
    propertyNames: [policyLevels]
    requirement: forbidden
    title: Root `sap` namespace reserved for aligned policy levels
    note: |
      Only centrally aligned policy levels (such as `sap:base:v1` or `sap:core:v1`) MAY use the root `sap` namespace. Custom policy levels MUST NOT use the root `sap` namespace, e.g. `sap:s4:v1` is not allowed.

  - id: namespaces.registered
    scope: general
    section: General Policies
    requirement: mandatory
    title: Namespaces must be registered
    note: |
      All SAP [namespaces](../../spec-v1/index.md#namespaces) MUST be registered in the SAP namespace-registry.

      - All ORD resources owned by SAP MUST use the `sap` vendor namespace
      - ORD resources or extensions created or governed within a customer scope SHOULD use the `customer` vendor namespace or its shorter alias `c`.
      - The `customer` and `c` namespaces MUST NOT be used for content published in a global marketplace or otherwise shared globally unless the platform allocating the ORD IDs guarantees their global uniqueness across customer scopes.
      - If that guarantee does not exist, partner content MUST be exported with ORD IDs under the partner's registered vendor namespace before it is offered globally.

  - id: extensible-enums.reserved-prefixes
    scope: general
    section: General Policies
    requirement: forbidden
    title: Reserved prefixes in extensible enums
    note: |
      The `ord:` and the root `sap:` prefixes are reserved for centrally aligned, specification-defined values in extensible enums whose values are namespace-prefixed.
      This applies to any value that is a [Specification ID](../../spec-v1/index.md#specification-id), [Concept ID](../../spec-v1/index.md#concept-id), or [Correlation ID](../../spec-v1/index.md#correlation-id). Affected fields include `purpose`, `relationType`, `correlationIds`, and others.

      - The `ord:` prefix MUST NOT be used by vendors (reserved for the ORD specification itself).
      - The root `sap:` prefix MUST NOT be used for application-specific values. Applications and services MUST use a sub-namespace such as `sap.foo:...` instead (e.g. `sap.s4:...` is allowed, `sap:...` is not).

  - id: package.vendor
    scope: definition
    definitions:
      - package
    requirement: mandatory
    title: Package vendor
    note: |
      The vendor of a Package MUST be set to `sap:vendor:SAP:`, `customer:vendor:Customer:`, or the registered Vendor of the partner to which ownership is attributed.

  - id: vendor.central
    scope: definition
    definitions:
      - vendor
    requirement: forbidden
    title: SAP Vendor is defined centrally
    note: |
      Although `Vendor` is technically not validated by a policy level, we need to ensure that within SAP we don't define the SAP vendor multiple times or reference it differently.

      - The SAP `Vendor` MUST NOT be defined by any SAP application or service, as this is done centrally.
      - The correct value for a SAP vendor reference is `sap:vendor:SAP:`.
