name: Release
on:
  workflow_dispatch:
    inputs:
      npm:
        description: "NPMJS Package"
        required: false
        type: boolean
        default: true
      githubRelease:
        description: "GitHub Release"
        required: false
        type: boolean
        default: true
jobs:
  npm:
    if: inputs.npm
    runs-on: ubuntu-latest
    environment: npmjs-registry
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          # registry-url is required for releasing packages
          registry-url: ${{ vars.NPM_REGISTRY }}

      - name: Install dependencies
        run: npm ci

      - name: Generate
        run: npm run generate

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build:docusaurus

      - name: Publish to NPM
        run: npm publish

  githubRelease:
    needs: [npm]
    if: |
      always() &&
      !contains(needs.*.result, 'cancelled') &&
      !contains(needs.*.result, 'failure') &&
      inputs.githubRelease
    runs-on: ubuntu-latest
    permissions:
      contents: write # Push changelog branch, create tags and releases
      pull-requests: write # Open the changelog PR
      actions: write # Dispatch CI workflows for the changelog PR
      checks: write # Mirror CI job results as Check Runs on the changelog PR
      statuses: write # Mirror CI job results as Commit Statuses on the changelog PR
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        uses: open-resource-discovery/github-release@v0.1.0
