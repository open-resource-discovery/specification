    <text x="712.5" y="213.07" font-size="10.5" text-anchor="middle" fill="#0a0f12">System Type refs (0..n)</text>
    <text x="712.5" y="240.23" font-size="9.5" text-anchor="middle" fill="#5a6a73">Alternatives within each aspect</text>
    <rect x="615" y="305" width="195" height="104" rx="6" fill="#d5e5f6" stroke="#5c8fb9" stroke-width="1.2" />
    <text x="712.5" y="324" font-size="13" text-anchor="middle" fill="#0a0f12">API Resource</text>
    <rect x="625" y="342" width="175" height="23" rx="0" fill="#e9eef3" stroke="#8799a6" stroke-width="1.2" />
    <text x="712.5" y="357.58" font-size="12" text-anchor="middle" fill="#5a6a73">Definitions (0..n)</text>
    <text x="712.5" y="390.74" font-size="11" text-anchor="middle" fill="#0a0f12">e.g. A2A Agent Card</text>
  </g>
