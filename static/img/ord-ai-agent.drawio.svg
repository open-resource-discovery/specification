    <path d="M 300 227.5 L 175 227.5" marker-end="url(#agent-reference-arrow)" stroke-linejoin="round" />
    <path d="M 300 260 L 245 260 L 245 344.5 L 175 344.5" marker-end="url(#agent-reference-arrow)" stroke-linejoin="round" />
    <path d="M 397.5 170 L 397.5 86" marker-end="url(#agent-reference-arrow)" stroke-linejoin="round" />
    <path d="M 485 222 L 550 222 L 550 140 L 615 140" marker-end="url(#agent-reference-arrow)" stroke-linejoin="round" />
