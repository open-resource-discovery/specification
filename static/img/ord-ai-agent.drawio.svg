    <rect x="300" y="40" width="195" height="46" rx="6" fill="#d5e5f6" stroke="#5c8fb9" stroke-width="1.2" />
    <text x="397.5" y="67.42" font-size="13" text-anchor="middle" fill="#0a0f12">Entity Type</text>
