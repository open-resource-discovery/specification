<svg xmlns="http://www.w3.org/2000/svg" width="830px" height="428px" viewBox="0 0 830 428" style="background: #ffffff; color-scheme: light;" role="img" aria-labelledby="agent-model-title agent-model-desc" content="&lt;mxfile&gt;&lt;diagram id=&quot;ord-agent-relationships&quot; name=&quot;Agent Relationships&quot;&gt;&lt;/diagram&gt;&lt;/mxfile&gt;">
  <title id="agent-model-title">Agent relationships in ORD</title>
  <desc id="agent-model-desc">An Agent belongs to exactly one Package and can reference Products, Groups, related Entity Types, and successor Agents. It can expose zero or more API Resources and declare zero or more Integration Dependencies. API Resources can have Resource Definitions, such as an A2A Agent Card. Integration Dependency aspects can reference API Resources, Event Resources, Capabilities, or System Types. Arrows show metadata references. Repeated resources are represented by cardinalities, not stacked boxes.</desc>
