<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="440" viewBox="0 0 1160 440" role="img" aria-labelledby="title description">
  <title id="title">Provider perspective selection</title>
  <desc id="description">Publish tenant-specific metadata in a complete system-instance perspective. Publish version-dependent static metadata in system-version and version-independent static metadata in system-type. Both static layers may be used together.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 10 5 0 10z" class="arrow-head"/>
    </marker>
    <style>
      svg { color-scheme: light dark; font-family: Arial, Helvetica, sans-serif; }
      .entry { fill: light-dark(#dae8fc, #1e3a5f); stroke: light-dark(#6c8ebf, #8ab4f8); stroke-width: 2; }
      .decision { fill: light-dark(#f5f5f5, #2b2d31); stroke: light-dark(#666, #c5c7ca); stroke-width: 2; }
      .result { fill: light-dark(#d5e8d4, #1f4328); stroke: light-dark(#82b366, #88cf8c); stroke-width: 2; }
      .edge { fill: none; stroke: light-dark(#4d4d4d, #d4d4d4); stroke-width: 2; marker-end: url(#arrow); }
      .arrow-head { fill: context-stroke; }
      text { fill: light-dark(#1f2328, #f2f3f5); font-size: 17px; text-anchor: middle; dominant-baseline: middle; }
      .label { font-size: 15px; font-weight: 700; paint-order: stroke; stroke: light-dark(#fff, #1b1b1b); stroke-width: 5px; stroke-linejoin: round; }
      .note { font-size: 15px; font-style: italic; }
    </style>
  </defs>

  <rect class="entry" x="20" y="175" width="170" height="70" rx="8"/>
  <text x="105" y="198"><tspan x="105">ORD metadata</tspan><tspan x="105" dy="24">to publish</tspan></text>
  <rect class="decision" x="260" y="155" width="250" height="110" rx="8"/>
  <text x="385" y="185"><tspan x="385">Does this metadata vary</tspan><tspan x="385" dy="24">by tenant or system instance?</tspan></text>
  <path class="edge" d="M190 210h70"/>

  <rect class="result" x="650" y="20" width="450" height="100" rx="8"/>
  <text x="875" y="48"><tspan x="875">Publish in a complete system-instance perspective</tspan><tspan x="875" dy="24">Also publish the applicable static layers below</tspan></text>
  <path class="edge" d="M385 155V70h265"/>
  <text class="label" x="405" y="137">Yes</text>

  <rect class="decision" x="650" y="155" width="300" height="110" rx="8"/>
  <text x="800" y="185"><tspan x="800">Can this static metadata differ</tspan><tspan x="800" dy="24">between system versions?</tspan></text>
  <path class="edge" d="M510 210h140"/>
  <text class="label" x="580" y="196">No</text>

  <rect class="result" x="650" y="330" width="300" height="80" rx="8"/>
  <text x="800" y="358"><tspan x="800">Publish in system-type</tspan><tspan x="800" dy="24">Version-independent layer</tspan></text>
  <path class="edge" d="M800 265v65"/>
  <text class="label" x="820" y="298">No</text>

  <rect class="result" x="990" y="155" width="160" height="110" rx="8"/>
  <text x="1070" y="185"><tspan x="1070">Publish in</tspan><tspan x="1070" dy="24">system-version</tspan><tspan x="1070" dy="24">Version layer</tspan></text>
  <path class="edge" d="M950 210h40"/>
  <text class="label" x="970" y="196">Yes</text>

  <text class="note" x="375" y="370"><tspan x="375">A provider may use both static layers.</tspan><tspan x="375" dy="22">Each ORD ID remains a complete representation.</tspan></text>
</svg>
