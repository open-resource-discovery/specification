<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="1360" viewBox="0 0 1260 1360" role="img" aria-labelledby="title description">
  <title id="title">ORD perspective resolution</title>
  <desc id="description">Resolution paths for system-instance ORD resource lookups and static metadata requests. A resource omitted from a selected system-instance or system-version perspective is not available in that scope and is not filled in from another perspective.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 8 4 0 8z" class="arrow-head"/>
    </marker>
    <style>
      svg { color-scheme: light dark; font-family: Arial, Helvetica, sans-serif; }
      .entry { fill: light-dark(#dae8fc, #1e3a5f); stroke: light-dark(#6c8ebf, #8ab4f8); stroke-width: 2; }
      .decision { fill: light-dark(#f5f5f5, #2b2d31); stroke: light-dark(#666, #c5c7ca); stroke-width: 1.5; }
      .success { fill: light-dark(#d5e8d4, #1f4328); stroke: light-dark(#82b366, #88cf8c); stroke-width: 2; }
      .absent { fill: light-dark(#fff2cc, #4d411c); stroke: light-dark(#d6b656, #e0c66d); stroke-width: 2; }
      .failure { fill: light-dark(#f8cecc, #572727); stroke: light-dark(#b85450, #ef8b87); stroke-width: 2; }
      .edge { fill: none; stroke: light-dark(#4d4d4d, #d4d4d4); stroke-width: 1.5; marker-end: url(#arrow); }
      .divider { stroke: light-dark(#c7c7c7, #666); stroke-width: 1; stroke-dasharray: 4 5; }
      .arrow-head { fill: context-stroke; }
      text { fill: light-dark(#1f2328, #f2f3f5); font-size: 14px; text-anchor: middle; dominant-baseline: middle; }
      .compact { font-size: 12px; }
      .label { font-size: 12px; paint-order: stroke; stroke: light-dark(#fff, #1b1b1b); stroke-width: 4px; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- System-instance resource lookup -->
  <rect class="entry" x="10" y="26" width="175" height="48" rx="7"/>
  <text x="97.5" y="42"><tspan x="97.5">System-instance</tspan><tspan x="97.5" dy="17">resource lookup</tspan></text>
  <polygon class="decision" points="270,2 345,50 270,98 195,50"/>
  <text x="270" y="42"><tspan x="270">System-instance</tspan><tspan x="270" dy="17">perspective published?</tspan></text>
  <path class="edge" d="M185 50h10"/>
  <polygon class="decision" points="470,2 545,50 470,98 395,50"/>
  <text class="compact" x="470" y="30"><tspan x="470">Resource</tspan><tspan x="470" dy="14">available in</tspan><tspan x="470" dy="14">system-instance</tspan><tspan x="470" dy="14">perspective?</tspan></text>
  <path class="edge" d="M345 50h50"/>
  <text class="label" x="370" y="40">Yes</text>
  <rect class="success" x="850" y="20" width="390" height="60" rx="7"/>
  <text x="1045" y="42"><tspan x="1045">Resource available in</tspan><tspan x="1045" dy="17">system-instance perspective</tspan></text>
  <path class="edge" d="M545 50h305"/>
  <text class="label" x="570" y="40">Yes</text>
  <rect class="absent" x="850" y="112" width="390" height="56" rx="7"/>
  <text x="1045" y="131"><tspan x="1045">Resource not available</tspan><tspan x="1045" dy="17">on system instance</tspan></text>
  <path class="edge" d="M470 98v42h380"/>
  <text class="label" x="484" y="110">No</text>

  <polygon class="decision" points="270,182 345,230 270,278 195,230"/>
  <text x="270" y="222"><tspan x="270">System version</tspan><tspan x="270" dy="17">known?</tspan></text>
  <path class="edge" d="M270 98v84"/>
  <text class="label" x="284" y="118">No</text>

  <polygon class="decision" points="470,182 545,230 470,278 395,230"/>
  <text x="470" y="210"><tspan x="470">Exact</tspan><tspan x="470" dy="14">system-version</tspan><tspan x="470" dy="14">perspective</tspan><tspan x="470" dy="14">published?</tspan></text>
  <path class="edge" d="M345 230h50"/>
  <text class="label" x="370" y="220">Yes</text>
  <polygon class="decision" points="670,182 745,230 670,278 595,230"/>
  <text class="compact" x="670" y="202"><tspan x="670">Resource</tspan><tspan x="670" dy="14">available in exact</tspan><tspan x="670" dy="14">system-version</tspan><tspan x="670" dy="14">perspective?</tspan></text>
  <path class="edge" d="M545 230h50"/>
  <text class="label" x="570" y="220">Yes</text>
  <rect class="success" x="850" y="203" width="390" height="56" rx="7"/>
  <text x="1045" y="222"><tspan x="1045">Resource available in</tspan><tspan x="1045" dy="17">exact system-version perspective</tspan></text>
  <path class="edge" d="M745 230h105"/>
  <text class="label" x="770" y="220">Yes</text>
  <rect class="absent" x="850" y="290" width="390" height="56" rx="7"/>
  <text x="1045" y="309"><tspan x="1045">Resource not found in</tspan><tspan x="1045" dy="17">exact system-version perspective</tspan></text>
  <path class="edge" d="M670 278v40h180"/>
  <text class="label" x="684" y="290">No</text>
  <rect class="failure" x="850" y="362" width="390" height="56" rx="7"/>
  <text x="1045" y="381"><tspan x="1045">Resource availability unknown:</tspan><tspan x="1045" dy="17">exact system-version perspective unavailable</tspan></text>
  <path class="edge" d="M470 278v112h380"/>
  <text class="label" x="484" y="289">No</text>

  <polygon class="decision" points="470,422 545,470 470,518 395,470"/>
  <text x="470" y="450"><tspan x="470">Latest stable</tspan><tspan x="470" dy="14">system-version</tspan><tspan x="470" dy="14">perspective</tspan><tspan x="470" dy="14">published?</tspan></text>
  <path class="edge" d="M270 278v192h125"/>
  <text class="label" x="284" y="295">No</text>
  <polygon class="decision" points="670,422 745,470 670,518 595,470"/>
  <text class="compact" x="670" y="449"><tspan x="670">Resource</tspan><tspan x="670" dy="14">available in latest</tspan><tspan x="670" dy="14">stable system-version</tspan><tspan x="670" dy="14">perspective?</tspan></text>
  <path class="edge" d="M545 470h50"/>
  <text class="label" x="570" y="460">Yes</text>
  <rect class="success" x="850" y="443" width="390" height="56" rx="7"/>
  <text x="1045" y="462"><tspan x="1045">Resource available in</tspan><tspan x="1045" dy="17">latest stable system-version perspective</tspan></text>
  <path class="edge" d="M745 470h105"/>
  <text class="label" x="770" y="460">Yes</text>
  <rect class="absent" x="850" y="520" width="390" height="56" rx="7"/>
  <text x="1045" y="539"><tspan x="1045">Resource not found in</tspan><tspan x="1045" dy="17">latest stable system-version perspective</tspan></text>
  <path class="edge" d="M670 518v30h180"/>
  <text class="label" x="684" y="530">No</text>
  <polygon class="decision" points="670,572 745,620 670,668 595,620"/>
  <text class="compact" x="670" y="599"><tspan x="670">Resource</tspan><tspan x="670" dy="14">available in</tspan><tspan x="670" dy="14">system-type</tspan><tspan x="670" dy="14">perspective?</tspan></text>
  <path class="edge" d="M470 518v102h125"/>
  <text class="label" x="484" y="540">No</text>
  <rect class="success" x="850" y="593" width="390" height="56" rx="7"/>
  <text x="1045" y="612"><tspan x="1045">Resource available in</tspan><tspan x="1045" dy="17">system-type perspective</tspan></text>
  <path class="edge" d="M745 620h105"/>
  <text class="label" x="770" y="610">Yes</text>
  <rect class="absent" x="850" y="666" width="390" height="56" rx="7"/>
  <text x="1045" y="685"><tspan x="1045">Resource not found in</tspan><tspan x="1045" dy="17">available static perspectives</tspan></text>
  <path class="edge" d="M670 668v26h180"/>
  <text class="label" x="684" y="680">No</text>

  <path class="divider" d="M10 750h1230"/>

  <!-- Explicit version request -->
  <rect class="entry" x="10" y="786" width="175" height="56" rx="7"/>
  <text x="97.5" y="805"><tspan x="97.5">Static metadata request</tspan><tspan x="97.5" dy="17">for a specific version</tspan></text>
  <polygon class="decision" points="470,766 545,814 470,862 395,814"/>
  <text x="470" y="794"><tspan x="470">Requested</tspan><tspan x="470" dy="14">system-version</tspan><tspan x="470" dy="14">perspective</tspan><tspan x="470" dy="14">published?</tspan></text>
  <path class="edge" d="M185 814h210"/>
  <polygon class="decision" points="670,766 745,814 670,862 595,814"/>
  <text class="compact" x="670" y="793"><tspan x="670">Resource</tspan><tspan x="670" dy="14">available in requested</tspan><tspan x="670" dy="14">system-version</tspan><tspan x="670" dy="14">perspective?</tspan></text>
  <path class="edge" d="M545 814h50"/>
  <text class="label" x="570" y="804">Yes</text>
  <rect class="success" x="850" y="786" width="390" height="56" rx="7"/>
  <text x="1045" y="805"><tspan x="1045">Resource available in</tspan><tspan x="1045" dy="17">requested system-version perspective</tspan></text>
  <path class="edge" d="M745 814h105"/>
  <text class="label" x="770" y="804">Yes</text>
  <rect class="absent" x="850" y="864" width="390" height="56" rx="7"/>
  <text x="1045" y="883"><tspan x="1045">Resource not found in</tspan><tspan x="1045" dy="17">requested system-version perspective</tspan></text>
  <path class="edge" d="M670 862v30h180"/>
  <text class="label" x="684" y="874">No</text>
  <rect class="failure" x="850" y="936" width="390" height="56" rx="7"/>
  <text x="1045" y="955"><tspan x="1045">Resource availability unknown:</tspan><tspan x="1045" dy="17">requested system-version perspective unavailable</tspan></text>
  <path class="edge" d="M470 862v102h380"/>
  <text class="label" x="484" y="874">No</text>

  <path class="divider" d="M10 1010h1230"/>

  <!-- System-type request -->
  <rect class="entry" x="10" y="1046" width="175" height="48" rx="7"/>
  <text x="97.5" y="1062"><tspan x="97.5">Static metadata request</tspan><tspan x="97.5" dy="17">without a version</tspan></text>
  <polygon class="decision" points="470,1022 545,1070 470,1118 395,1070"/>
  <text x="470" y="1050"><tspan x="470">Latest stable</tspan><tspan x="470" dy="14">system-version</tspan><tspan x="470" dy="14">perspective</tspan><tspan x="470" dy="14">published?</tspan></text>
  <path class="edge" d="M185 1070h210"/>
  <polygon class="decision" points="670,1022 745,1070 670,1118 595,1070"/>
  <text class="compact" x="670" y="1049"><tspan x="670">Resource</tspan><tspan x="670" dy="14">available in latest</tspan><tspan x="670" dy="14">stable system-version</tspan><tspan x="670" dy="14">perspective?</tspan></text>
  <path class="edge" d="M545 1070h50"/>
  <text class="label" x="570" y="1060">Yes</text>
  <rect class="success" x="850" y="1042" width="390" height="56" rx="7"/>
  <text x="1045" y="1061"><tspan x="1045">Resource available in</tspan><tspan x="1045" dy="17">latest stable system-version perspective</tspan></text>
  <path class="edge" d="M745 1070h105"/>
  <text class="label" x="770" y="1060">Yes</text>
  <rect class="absent" x="850" y="1115" width="390" height="56" rx="7"/>
  <text x="1045" y="1134"><tspan x="1045">Resource not found in</tspan><tspan x="1045" dy="17">latest stable system-version perspective</tspan></text>
  <path class="edge" d="M670 1118v25h180"/>
  <text class="label" x="684" y="1130">No</text>
  <polygon class="decision" points="670,1170 745,1218 670,1266 595,1218"/>
  <text class="compact" x="670" y="1197"><tspan x="670">Resource</tspan><tspan x="670" dy="14">available in</tspan><tspan x="670" dy="14">system-type</tspan><tspan x="670" dy="14">perspective?</tspan></text>
  <path class="edge" d="M470 1118v100h125"/>
  <text class="label" x="484" y="1140">No</text>
  <rect class="success" x="850" y="1190" width="390" height="56" rx="7"/>
  <text x="1045" y="1209"><tspan x="1045">Resource available in</tspan><tspan x="1045" dy="17">system-type perspective</tspan></text>
  <path class="edge" d="M745 1218h105"/>
  <text class="label" x="770" y="1208">Yes</text>
  <rect class="absent" x="850" y="1263" width="390" height="56" rx="7"/>
  <text x="1045" y="1282"><tspan x="1045">Resource not found in</tspan><tspan x="1045" dy="17">available static perspectives</tspan></text>
  <path class="edge" d="M670 1266v25h180"/>
  <text class="label" x="684" y="1278">No</text>
</svg>
