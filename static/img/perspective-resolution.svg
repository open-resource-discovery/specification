<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title description">
  <title id="title">ORD perspective resolution</title>
  <desc id="description">A complete system-instance perspective replaces static metadata for a tenant. Otherwise, static resolution looks up an ORD ID in the selected system-version layer first and then in the system-type layer. The selected representation is never merged property by property.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 10 5 0 10z" class="arrow-head"/>
    </marker>
    <style>
      svg { color-scheme: light dark; font-family: Arial, Helvetica, sans-serif; }
      .panel { fill: light-dark(#fafafa, #202124); stroke: light-dark(#b7b7b7, #74777c); stroke-width: 2; }
      .entry { fill: light-dark(#dae8fc, #1e3a5f); stroke: light-dark(#6c8ebf, #8ab4f8); stroke-width: 2; }
      .decision { fill: light-dark(#fff2cc, #4d411c); stroke: light-dark(#d6b656, #e0c66d); stroke-width: 2; }
      .success { fill: light-dark(#d5e8d4, #1f4328); stroke: light-dark(#82b366, #88cf8c); stroke-width: 2; }
      .failure { fill: light-dark(#f8cecc, #572727); stroke: light-dark(#b85450, #ef8b87); stroke-width: 2; }
      .edge { fill: none; stroke: light-dark(#4d4d4d, #d4d4d4); stroke-width: 2; marker-end: url(#arrow); }
      .arrow-head { fill: context-stroke; }
      text { fill: light-dark(#1f2328, #f2f3f5); font-size: 17px; text-anchor: middle; dominant-baseline: middle; }
      .heading { font-size: 23px; font-weight: 700; }
      .note { font-size: 15px; }
      .label { font-size: 15px; font-weight: 700; paint-order: stroke; stroke: light-dark(#fff, #1b1b1b); stroke-width: 5px; stroke-linejoin: round; }
    </style>
  </defs>

  <rect class="panel" x="20" y="20" width="1160" height="260" rx="12"/>
  <text class="heading" x="600" y="52">Tenant-aware request</text>
  <rect class="entry" x="70" y="105" width="250" height="80" rx="8"/>
  <text x="195" y="132"><tspan x="195">Is a system-instance</tspan><tspan x="195" dy="22">perspective published?</tspan></text>
  <rect class="success" x="470" y="85" width="300" height="120" rx="8"/>
  <text x="620" y="112"><tspan x="620">Use the complete tenant view</tspan><tspan x="620" dy="24">A missing ORD ID means</tspan><tspan x="620" dy="24">not available on that tenant</tspan></text>
  <rect class="decision" x="900" y="105" width="230" height="80" rx="8"/>
  <text x="1015" y="132"><tspan x="1015">Resolve the effective</tspan><tspan x="1015" dy="22">static view below</tspan></text>
  <path class="edge" d="M320 135h150"/>
  <text class="label" x="395" y="122">Yes</text>
  <path class="edge" d="M320 165h580"/>
  <text class="label" x="395" y="181">No</text>
  <text class="note" x="620" y="242">A published but unavailable tenant view is an error. Static fallback is allowed only when no tenant view is published.</text>

  <rect class="panel" x="20" y="310" width="1160" height="490" rx="12"/>
  <text class="heading" x="600" y="345">Static ORD ID resolution</text>
  <rect class="entry" x="60" y="405" width="260" height="100" rx="8"/>
  <text x="190" y="430"><tspan x="190">Choose version layer</tspan><tspan x="190" dy="23">Exact requested version, or</tspan><tspan x="190" dy="23">greatest published stable version</tspan></text>
  <rect class="decision" x="410" y="405" width="300" height="100" rx="8"/>
  <text x="560" y="430"><tspan x="560">ORD ID found in the applicable</tspan><tspan x="560" dy="23">available system-version layer?</tspan></text>
  <rect class="success" x="850" y="390" width="280" height="130" rx="8"/>
  <text x="990" y="421"><tspan x="990">Return the complete</tspan><tspan x="990" dy="24">system-version representation</tspan><tspan x="990" dy="24">No property merge</tspan></text>
  <path class="edge" d="M320 455h90"/>
  <path class="edge" d="M710 455h140"/>
  <text class="label" x="780" y="441">Yes</text>

  <rect class="decision" x="410" y="600" width="300" height="100" rx="8"/>
  <text x="560" y="625"><tspan x="560">ORD ID found in the available</tspan><tspan x="560" dy="23">system-type layer?</tspan></text>
  <path class="edge" d="M560 505v95"/>
  <text class="label" x="580" y="552">No</text>
  <rect class="success" x="850" y="565" width="280" height="100" rx="8"/>
  <text x="990" y="602"><tspan x="990">Return the complete</tspan><tspan x="990" dy="24">system-type representation</tspan></text>
  <path class="edge" d="M710 625h140"/>
  <text class="label" x="780" y="611">Yes</text>
  <rect class="failure" x="850" y="700" width="280" height="70" rx="8"/>
  <text x="990" y="724"><tspan x="990">ORD ID not found in the</tspan><tspan x="990" dy="22">effective static view</tspan></text>
  <path class="edge" d="M560 700v35h290"/>
  <text class="label" x="580" y="718">No</text>
  <text class="note" x="260" y="755"><tspan x="260">A version-layer tombstone stops resolution.</tspan><tspan x="260" dy="21">An unavailable published layer produces an error.</tspan></text>
</svg>
