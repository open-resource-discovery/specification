apiVersion: 'metadata-service.resource.api.sap/v6alpha1'
type: 'MetadataType'
metadata:
  name: 'ordoverlay'
  path: '/sap/core/ucl/metadata/ord/v1'
  labels: {}
spec:
  typeName: 'ORDOverlay'
  key:
    - 'id'
  visibility: 'public'
  embedded: false
  description: "⚠️ BETA: This specification is in beta and subject to change.\n\nThe ORD Overlay is an optional ORD model extension that allows patching referenced resource definition files\n(e.g. OpenAPI, AsyncAPI, OData CSDL, MCP/A2A Agent Cards) without modifying the original source files.\n\nOverlays use concept-level [selectors](#overlay-selector) that are independent of the target format's\ninternal structure, making them resilient to format changes.\nA `jsonPath` selector is available as a generic fallback.\n\nOverlay files MUST be published through Overlay Resources in an ORD Document,\nreferenced by `overlays[].definitions[]` with type `ord:overlay:v1`.\nThe patch file contains only the format-version envelope and patches. Identity, target, visibility,\nand purpose belong to the containing Overlay Resource.\nAttaching overlays to API or Event `resourceDefinitions` is deprecated."
  metadataProperties:
    - name: 'id'
      type: 'guid'
      mandatory: true
      unique: true
      description: 'UMS ID (globally unique), used for relations.'
    - name: '$schema'
      type: 'string'
      description: "Optional [URL](https://tools.ietf.org/html/rfc3986) to the ORD Overlay schema (defined as a JSON Schema).\nIf provided, this enables code intelligence and validation in supported editors (like VSCode) and tools."
    - name: 'ordOverlay'
      type: 'string'
      description: 'Version of the ORD Overlay specification.'
      mandatory: true
  customTypeDefinitions: []
  metadataRelations:
    - propertyName: 'patches'
      relatedTypeName: 'OverlayPatch'
      relatedTypeNamespace: '/sap/core/ucl/metadata/ord/v1'
      description: "Ordered sequence of patches to apply to the input definition selected by the containing Overlay Resource.\nPatches are applied strictly in the order they are listed.\nIf two patches target the same document element, both are applied in sequence —\nthe later patch supersedes the earlier one."
      mandatory: true
