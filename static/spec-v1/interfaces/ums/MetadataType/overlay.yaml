apiVersion: 'metadata-service.resource.api.sap/v6alpha1'
type: 'MetadataType'
metadata:
  name: 'overlay'
  path: '/sap/core/ucl/metadata/ord/v1'
  labels: {}
spec:
  typeName: 'Overlay'
  key:
    - 'id'
  visibility: 'public'
  embedded: false
  description: "An Overlay Resource is a standalone, versioned resource that references a metadata patch file.\nOverlays enrich / patch resource definition files (e.g. OpenAPI) without modifying the originals, e.g. to add AI-optimized descriptions, apply governance annotations, or adapt definitions for a specific audience / purpose.\n\nUse an Overlay Resource for overlays that serve a different concern or audience than the original metadata — such as AI enrichment, governance annotations, or audience-specific adaptations — and are managed independently.\nProviders MUST use an Overlay Resource for every published overlay, including producer-owned overlays\nthat patch a single resource. Attaching overlays to API or Event `resourceDefinitions` is deprecated."
  metadataProperties:
    - name: 'id'
      type: 'guid'
      mandatory: true
      unique: true
      description: 'UMS ID (globally unique), used for relations.'
    - name: 'ordId'
      type: 'string'
      description: "The ORD ID is a stable, globally unique ID for ORD resources or taxonomy.\n\nIt MUST be a valid [ORD ID](../concepts/identifiers.md#ord-id) of the appropriate ORD type."
      mandatory: true
      constraints:
        maxLength: 255
        pattern: '^([a-z0-9]+(?:[.][a-z0-9]+)*):(overlay):([a-zA-Z0-9._\-]+):(v0|v[1-9][0-9]*)$'
    - name: 'title'
      type: 'string'
      description: "Human-readable title.\n\nMUST NOT exceed 255 chars.\nMUST NOT contain line breaks."
      constraints:
        minLength: 1
        maxLength: 255
    - name: 'description'
      type: 'string'
      description: "Full description, notated in [CommonMark](https://spec.commonmark.org/) (Markdown).\n\nThe description SHOULD not be excessive in length and is not meant to provide full documentation.\nDetailed documentation SHOULD be attached as (typed) links."
      constraints:
        minLength: 1
    - name: 'version'
      type: 'string'
      description: "The complete [SemVer](https://semver.org/) version string.\n\nIt MUST follow the [Semantic Versioning 2.0.0](https://semver.org/) standard.\nIt SHOULD be changed if the ORD information or referenced resource definitions changed.\nIt SHOULD express minor and patch changes that don't lead to incompatible changes.\n\nWhen the `version` major version changes, the [ORD ID](../concepts/identifiers.md#ord-id) `<majorVersion>` fragment SHOULD be updated to be identical.\nIf a resource definition file also contains a version number (e.g. [OpenAPI `info.version`](https://spec.openapis.org/oas/v3.1.1.html#info-object)), it SHOULD match the resource `version` whenever possible.\nIf the native version does not follow SemVer, it MUST be converted to valid SemVer for ORD, preserving its ordering and compatibility semantics as closely as possible.\n\nIf the resource has been extended by the user, the change MUST be indicated via `lastUpdate`.\nThe `version` MUST not be bumped for changes in extensions.\n\nThe general [Version and Lifecycle](../concepts/versioning-and-lifecycle.md) flow MUST be followed.\n\nNote: A change is only relevant for a version increment, if it affects the ORD resource or ORD taxonomy directly.\nFor example: If a resource within a `Package` changes, but the Package itself did not, the Package version does not need to be incremented."
      mandatory: true
      constraints:
        pattern: '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$'
    - name: 'lastUpdate'
      type: 'string'
      description: "Optional, but RECOMMENDED indicator when (date-time) the last change to the resource (including its definitions) happened.\n\nThe date format MUST comply with [RFC 3339, section 5.6](https://tools.ietf.org/html/rfc3339#section-5.6).\n\nWhen retrieved from an ORD aggregator, `lastUpdate` will be reliable there and reflect either the provider based update time or the aggregator processing time.\nTherefore consumers MAY rely on it to detect changes to the metadata and the attached resource definition files.\n\nIf the resource has attached definitions, either the `version` or `lastUpdate` property MUST be defined and updated to let the ORD aggregator know that they need to be fetched again.\n\nTogether with `perspectives`, this property SHOULD be used to optimize the metadata crawling process of the ORD aggregators."
    - name: 'visibility'
      type: 'string'
      description: "Visibility of this Overlay Resource, all its patch files, and the projected resource definition.\nDefinition entries MUST inherit this visibility; they cannot override it.\nAggregators MUST enforce this audience on the overlay and the result, and MUST NOT expose\nrestricted input metadata to a broader audience without explicit authorization."
      mandatory: true
    - name: 'releaseStatus'
      type: 'string'
      description: "Defines the maturity level and stability commitment for the resource's API contract (interface, behavior, data models).\n\nThis indicates whether the resource may undergo backward-incompatible changes. It helps consumers understand the risk\nof depending on the resource and whether it's suitable for production use.\n\nNote: This is independent of `visibility` and does not imply availability guarantees or SLAs - it concerns only the API contract stability.\n\nSee [Lifecycle](../concepts/versioning-and-lifecycle.md#lifecycle) and [Compatibility](../concepts/versioning-and-lifecycle.md#compatibility) for more details."
      mandatory: true
    - name: 'purpose'
      type: 'string'
      description: "Purpose of this Overlay Resource and of the projected resource definition produced by applying it.\nMUST be a valid [Concept ID](../concepts/identifiers.md#concept-id).\nWhen omitted, the projected definition also has no purpose."
    - name: 'definitions'
      type: 'custom'
      customTypeName: 'OverlayDefinition'
      array: true
      description: "Ordered list of patch files contributing to this projection.\nEvery entry MUST have a unique combination of `type` and `mediaType` within this list.\nThe files are not necessarily alternative representations of the same operations.\nConsumers MUST apply every entry in array order, preserving patch order within each file.\nEach file operates on the result of the preceding file; later operations act on the modified state.\nA consumer that cannot process an entry MUST report an error rather than silently skip it.\nVisibility and purpose are defined exclusively on this Overlay Resource."
      mandatory: true
    - name: 'tags'
      type: 'string'
      array: true
      description: "List of free text style tags.\nNo special characters are allowed except `-`, `_`, `.`, `/` and ` `.\n\nTags that are assigned to a `Package` are inherited to all of the ORD resources it contains."
    - name: 'labels'
      type: 'custom'
      customTypeName: 'Labels'
      description: 'Generic labels that can be applied to most ORD information.'
  customTypeDefinitions:
    - name: 'OverlayDefinition'
      metadataProperties:
        - name: 'type'
          type: 'string'
          description: 'Type of the overlay definition'
          mandatory: true
        - name: 'mediaType'
          type: 'string'
          description: "The [Media Type](https://www.iana.org/assignments/media-types/media-types.xhtml) of the definition serialization format.\nA consuming application can use this information to know which file format parser it needs to use.\nFor example, for OpenAPI 3, it's valid to express the same definition in both YAML and JSON.\n\nIf no Media Type is registered for the referenced file,\n`text/plain` MAY be used for arbitrary plain-text and `application/octet-stream` for arbitrary binary data.\n"
          mandatory: true
          constraints:
            pattern: '^(application|text)\/[a-zA-Z0-9][a-zA-Z0-9.+\-]*$'
        - name: 'url'
          type: 'string'
          description: "[URL reference](https://tools.ietf.org/html/rfc3986#section-4.1) (URL or relative reference) to the resource definition file.\n\nIt is RECOMMENDED to provide a relative URL.\nIf relative, it is resolved against the ORD Document's root [`baseUrl`](#ord-document_baseurl) (the ORD provider base URL)."
          mandatory: true
        - name: 'accessStrategies'
          type: 'custom'
          customTypeName: 'AccessStrategy'
          array: true
          description: "List of supported access strategies for retrieving metadata from the ORD provider.\nAn ORD Consumer/ORD Aggregator MAY choose any of the strategies.\n\nThe access strategies only apply to the metadata access and not the actual API access.\nThe actual access to the APIs for clients is described via Consumption Bundles.\n\nIf this property is not provided, the definition URL will be available through the same access strategy as this ORD document.\nIt is RECOMMENDED anyway that the attached metadata definitions are available with the same access strategies, to simplify the aggregator crawling process."
    - name: 'AccessStrategy'
      metadataProperties:
        - name: 'type'
          type: 'string'
          description: 'Defines the authentication/authorization strategy through which the referenced `resourceDefinitions` are accessible.'
          mandatory: true
        - name: 'customType'
          type: 'string'
          description: "If the fixed `type` enum values need to be extended, an arbitrary `customType` can be provided.\n\nMUST be a valid [Specification ID](../concepts/identifiers.md#specification-id).\n\nMUST only be provided if `type` is set to `custom`."
          constraints:
            maxLength: 255
            pattern: '^([a-z0-9]+(?:[.][a-z0-9]+)*):([a-zA-Z0-9._\-]+):(v0|v[1-9][0-9]*)$'
        - name: 'customDescription'
          type: 'string'
          description: "Human-readable description about how the access is set up, notated in [CommonMark](https://spec.commonmark.org/) (Markdown).\n\nMUST only be provided if `type` is set to `custom`."
          constraints:
            minLength: 1
    - name: 'Labels'
      metadataProperties:
        - name: 'key'
          type: 'string'
        - name: 'value'
          type: 'string'
  metadataRelations:
    - propertyName: 'target'
      relatedTypeName: 'OverlayTarget'
      relatedTypeNamespace: '/sap/core/ucl/metadata/ord/v1'
      description: "Selects the ORD resource and the concrete input resource definition patched by every entry in `definitions`.\nThis is the sole source of target identification for the projection."
      mandatory: true
