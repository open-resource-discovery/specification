apiVersion: 'metadata-service.resource.api.sap/v6alpha1'
type: 'MetadataType'
metadata:
  name: 'overlayselectorbyoperation'
  path: '/sap/core/ucl/metadata/ord/v1'
  labels: {}
spec:
  typeName: 'OverlaySelectorByOperation'
  key:
    - 'id'
  visibility: 'public'
  embedded: true
  metadataProperties:
    - name: 'id'
      type: 'guid'
      mandatory: true
      unique: true
      description: 'UMS ID (globally unique), used for relations.'
    - name: 'operation'
      type: 'string'
      description: "Concept-level operation identifier.\nSupported mappings by format:\n- OpenAPI (`openapi-v2`, `openapi-v3`, `openapi-v3.1+`): maps to the `operationId` field on\n  an HTTP operation inside `paths.{path}.{method}`.\n- MCP (any Specification ID other than `a2a-agent-card`): maps to `tools[].name`.\n  See: https://modelcontextprotocol.io/specification/2025-11-25/schema#tool-name\n- A2A Agent Card (`a2a-agent-card`): maps to `skills[].id`.\n  See: https://google.github.io/A2A/specification/#agentskill-object\n- OData (`edmx`, `csdl-json`): maps to the Action or Function name at Schema level.\n  MUST use either the namespace-qualified name (e.g. `OData.Demo.Approval`) or its\n  namespace-qualified signature (e.g. `OData.Demo.Approval(Edm.Int32,Edm.String)`).\n  For OData v2 `edmx` targets: also searches FunctionImport elements in EntityContainer\n  when a selector without a signature matches no Schema-level Action or Function.\n  A signature selector MUST NOT match a FunctionImport.\n\n  A namespace-qualified name without a signature is sufficient only when it identifies\n  exactly one Action or Function.\n  Otherwise, the selector MUST use a signature containing every declared parameter type\n  in declaration order, including the binding parameter of a bound operation.\n  Signature matching uses exact parameter count, order, and types.\n  Empty parentheses select a zero-parameter operation, so `OData.Demo.Ping()` is distinct\n  from the name-only selector `OData.Demo.Ping`.\n\nWhen `definitionType` is set on `target`, the format is known and the selector resolves unambiguously.\nWhen `definitionType` is absent, the implementation SHOULD infer the format from the target\ndocument's content (e.g. the `openapi` field, `$schema`, or `$kind` markers)."
      mandatory: true
      constraints:
        minLength: 1
  customTypeDefinitions: []
  metadataRelations: []
