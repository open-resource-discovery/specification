apiVersion: 'metadata-service.resource.api.sap/v6alpha1'
type: 'MetadataType'
metadata:
  name: 'overlayselectorbygrouptypeid'
  path: '/sap/core/ucl/metadata/ord/v1'
  labels: {}
spec:
  typeName: 'OverlaySelectorByGroupTypeId'
  key:
    - 'id'
  visibility: 'public'
  embedded: true
  metadataProperties:
    - name: 'id'
      type: 'guid'
      mandatory: true
      unique: true
      description: 'UMS ID (globally unique), used for relations.'
    - name: 'groupTypeId'
      type: 'string'
      description: "Group Type ID of the [Group Type](../../spec-v1/interfaces/Document.md#group-type) to patch.\n\nSee [Patching ORD Metadata](#patching-ord-metadata) for the rules that apply to this selector."
      mandatory: true
      constraints:
        maxLength: 255
        pattern: '^([a-z0-9]+(?:[.][a-z0-9]+)*):([a-zA-Z0-9._\-\/]+)$'
  customTypeDefinitions: []
  metadataRelations: []
