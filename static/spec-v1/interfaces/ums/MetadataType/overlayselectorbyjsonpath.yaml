apiVersion: 'metadata-service.resource.api.sap/v6alpha1'
type: 'MetadataType'
metadata:
  name: 'overlayselectorbyjsonpath'
  path: '/sap/core/ucl/metadata/ord/v1'
  labels: {}
spec:
  typeName: 'OverlaySelectorByJsonPath'
  key:
    - 'id'
  visibility: 'public'
  embedded: true
  metadataProperties:
    - name: 'id'
      type: 'guid'
      mandatory: true
      unique: true
      description: 'UMS ID (globally unique), used for relations.'
    - name: 'jsonPath'
      type: 'string'
      description: "JSONPath expression targeting any location in a JSON/YAML-based target document.\nMUST start with `$`.\nThis is the generic structural fallback selector, supported for all JSON/YAML-based formats:\n- `openapi-v2`, `openapi-v3`, `openapi-v3.1+`: targets any node in the OpenAPI document.\n- `a2a-agent-card`: targets any node in the A2A Agent Card JSON document.\n- `csdl-json`: targets any node in the OData CSDL JSON document.\n- MCP (any Specification ID): targets any node in the MCP-compatible JSON/YAML tool metadata.\n\nJSONPath syntax and evaluation follow [RFC 9535](https://www.rfc-editor.org/rfc/rfc9535).\nEvery conforming toolkit MUST support this portable subset:\n- the root identifier `$`;\n- child-name selectors in dot notation or single-quoted or double-quoted bracket notation;\n- array selectors using non-negative indices;\n- object and array wildcards;\n- selector lists containing distinct member names or distinct non-negative array indices; and\n- array slices whose bounds are omitted or non-negative and whose step is omitted or positive.\n\nA portable ORD Overlay MUST NOT use JSONPath features outside this subset.\nToolkits MAY support additional RFC 9535 features or implementation-specific extensions,\nbut overlays using them are implementation-specific and not portable.\nA toolkit that does not support an expression MUST report an error and MUST NOT treat the\nexpression as matching zero elements.\n\nUse concept-level selectors (`operation`, `entityType`, etc.) when available, as they are\nresilient to structural differences between format versions. Reserve `jsonPath` for cases\nwhere no concept-level selector covers the target location."
      mandatory: true
      constraints:
        minLength: 1
        pattern: '^\$'
  customTypeDefinitions: []
  metadataRelations: []
