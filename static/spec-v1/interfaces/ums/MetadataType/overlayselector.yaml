apiVersion: 'metadata-service.resource.api.sap/v6alpha1'
type: 'MetadataType'
metadata:
  name: 'overlayselector'
  path: '/sap/core/ucl/metadata/ord/v1'
  labels: {}
spec:
  typeName: 'OverlaySelector'
  key:
    - 'id'
  visibility: 'public'
  embedded: true
  description: "Identifies the element in the target to patch.\nExactly one selector type is used per patch.\n\nPrefer concept-level selectors over generic `jsonPath` where possible,\nas they are resilient to structural changes in the target format.\n\nBehavior when a selector matches nothing, for `merge` and `update`:\n- All selectors match only structure the target already declares. Overlays patch what\n  exists; they do not synthesize structure. This includes the generic `jsonPath` selector:\n  it MUST NOT create a missing target.\n- A `merge` or `update` whose selector matches nothing MUST error.\n  (`root` always resolves, so this cannot arise for `root`.)\n- This is a deliberate limitation of this version: there is no create-on-missing behavior.\n  Erroring surfaces selector typos and wrong assumptions about the target structure\n  instead of silently authoring unintended content. A future version MAY add a dedicated\n  create action if a concrete use case requires it.\n\nTooling MAY offer a control to relax this to a warning or a skip (e.g. a `noMatchBehavior`\noption), but the default behavior is to error so that identical overlays behave identically\nacross implementations. See the `remove` action for the no-match rule specific to removal."
  metadataProperties:
    - name: 'id'
      type: 'guid'
      mandatory: true
      unique: true
      description: 'UMS ID (globally unique), used for relations.'
  customTypeDefinitions: []
  metadataRelations: []
