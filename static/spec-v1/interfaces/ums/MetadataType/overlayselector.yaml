apiVersion: 'metadata-service.resource.api.sap/v6alpha1'
type: 'MetadataType'
metadata:
  name: 'overlayselector'
  path: '/sap/core/ucl/metadata/ord/v1'
  labels: {}
spec:
  typeName: 'OverlaySelector'
  key:
    - 'id'
  visibility: 'public'
  embedded: true
  description: "Identifies the element in the target to patch.\nExactly one selector type is used per patch.\n\nPrefer concept-level selectors over generic `jsonPath` where possible,\nas they are resilient to structural changes in the target format.\n\nBehavior when a selector matches nothing, for `merge` and `update`:\n- Concept-level selectors (`operation`, `entityType`, `complexType`, `enumType`,\n  `propertyType`, `entitySet`, `namespace`, `parameter`, `returnType`) MUST error.\n  Overlays patch structure the target already declares; they do not create modeled concepts.\n- The generic `jsonPath` selector MAY create the missing target when its parent path\n  resolves to an object (JSON Merge Patch-style). A fully unresolvable parent chain MUST error.\n- `root` always resolves.\n\nTooling MAY offer a control to relax the concept-selector rule (e.g. warn or ignore instead\nof error), but the default behavior is as stated so that identical overlays behave identically\nacross implementations. See the `remove` action for the no-match rule specific to removal."
  metadataProperties:
    - name: 'id'
      type: 'guid'
      mandatory: true
      unique: true
      description: 'UMS ID (globally unique), used for relations.'
  customTypeDefinitions: []
  metadataRelations: []
