apiVersion: 'metadata-service.resource.api.sap/v6alpha1'
type: 'MetadataType'
metadata:
  name: 'overlayselector'
  path: '/sap/core/ucl/metadata/ord/v1'
  labels: {}
spec:
  typeName: 'OverlaySelector'
  key:
    - 'id'
  visibility: 'public'
  embedded: true
  description: "Identifies the element in the target to patch.\nExactly one selector type is used per patch.\n\nPrefer concept-level selectors over generic `jsonPath` where possible,\nas they are resilient to structural changes in the target format.\n\nSelector behavior:\n- All selectors match only structure the target already declares.\n  Overlays patch what exists; they do not synthesize the selected element.\n  This includes `jsonPath`, which MUST NOT create a missing target.\n- A patch whose selector matches nothing MUST error for every action.\n  (`root` always resolves, so this cannot arise for `root`.)\n- A `jsonPath` selector MAY match multiple elements.\n  The patch is applied to every matched element.\n- This is a deliberate limitation of this version: there is no create-on-missing behavior.\n  Erroring surfaces selector typos and wrong assumptions about the target structure\n  instead of silently authoring unintended content. A future version MAY add a dedicated\n  create action if a concrete use case requires it."
  metadataProperties:
    - name: 'id'
      type: 'guid'
      mandatory: true
      unique: true
      description: 'UMS ID (globally unique), used for relations.'
  customTypeDefinitions: []
  metadataRelations: []
