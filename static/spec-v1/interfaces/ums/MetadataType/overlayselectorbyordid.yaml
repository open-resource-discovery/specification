apiVersion: 'metadata-service.resource.api.sap/v6alpha1'
type: 'MetadataType'
metadata:
  name: 'overlayselectorbyordid'
  path: '/sap/core/ucl/metadata/ord/v1'
  labels: {}
spec:
  typeName: 'OverlaySelectorByOrdId'
  key:
    - 'id'
  visibility: 'public'
  embedded: true
  metadataProperties:
    - name: 'id'
      type: 'guid'
      mandatory: true
      unique: true
      description: 'UMS ID (globally unique), used for relations.'
    - name: 'ordId'
      type: 'string'
      description: "ORD ID of the [ORD resource](../../spec-v1/index.md#ord-resource) to patch, such as an API Resource, Event Resource, or Data Product.\nMUST be a valid [ORD ID](../../spec-v1/concepts/identifiers.md#ord-id).\n\nThe patch applies to the ORD metadata of the resource (e.g. `title`, `description`, `tags`),\nnot to a resource definition file that the resource references.\n\nSee [Patching ORD Metadata](#patching-ord-metadata) for the rules that apply to this selector."
      mandatory: true
      constraints:
        maxLength: 255
        pattern: '^([a-z0-9]+(?:[.][a-z0-9]+)*):([a-zA-Z0-9._\-]+):([a-zA-Z0-9._\-]+):(v0|v[1-9][0-9]*)$'
  customTypeDefinitions: []
  metadataRelations: []
