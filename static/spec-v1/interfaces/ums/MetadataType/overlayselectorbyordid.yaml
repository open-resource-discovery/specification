apiVersion: 'metadata-service.resource.api.sap/v6alpha1'
type: 'MetadataType'
metadata:
  name: 'overlayselectorbyordid'
  path: '/sap/core/ucl/metadata/ord/v1'
  labels: {}
spec:
  typeName: 'OverlaySelectorByOrdId'
  key:
    - 'id'
  visibility: 'public'
  embedded: true
  metadataProperties:
    - name: 'id'
      type: 'guid'
      mandatory: true
      unique: true
      description: 'UMS ID (globally unique), used for relations.'
    - name: 'ordId'
      type: 'string'
      description: "ORD ID of the ORD resource to patch, such as an API Resource, Event Resource, or Data Product.\nMUST be a valid [ORD ID](../../spec-v1/concepts/identifiers.md#ord-id).\n\nThe patch applies to the metadata of the ORD resource itself (e.g. `title`, `description`, `tags`),\nnot to a resource definition file that the resource references.\nThe resource type is derived from the ORD ID.\n\nAn overlay that uses this selector:\n- MUST use it in all of its patches, and MAY patch several ORD resources with different `ordId` values.\n- MUST set `ordOverlay` to `0.2`.\n- SHOULD omit `target`, because each patch identifies its own resource.\n- MUST be published as an [ORD Document Resource](#as-an-ord-document-resource), not attached as a `resourceDefinitions` entry."
      mandatory: true
      constraints:
        maxLength: 255
        pattern: '^([a-z0-9]+(?:[.][a-z0-9]+)*):([a-zA-Z0-9._\-]+):([a-zA-Z0-9._\-]+):(v0|v[1-9][0-9]*)$'
  customTypeDefinitions: []
  metadataRelations: []
