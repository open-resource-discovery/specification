openapi: 3.1.0
info:
  title: Open Resource Discovery Aggregator Push API
  version: 1.0.0
  description: |-
    The ORD Aggregator Push API lets an authenticated ORD provider stage ORD Documents and
    resource definitions in a submission and publish them after asynchronous validation.

    Staged artifacts are not discoverable.
    By default, a commit publishes every valid publication unit and skips units with errors.
    One ORD information object and every resource definition it declares form one publication
    unit, so a resource is never published without all of its valid definitions.
    A provider can opt into strict validation, in which any error publishes nothing and leaves
    the submission available for correction until it expires.
    In `replace` mode, omission removes the authenticated ORD provider's prior contributions in the
    publication context. An ORD provider can have at most one active submission per publication
    context.

    Every operation requires authentication.
    The aggregator chooses the machine-to-machine authentication mechanism and communicates
    its API base URL and credentials during onboarding.
    An aggregator may rate limit any operation.
    A rate-limited response includes Retry-After so a client that chooses to retry can do so efficiently.
    During onboarding, the aggregator documents supported request Content-Encoding values and limits
    for encoded requests, decoded artifacts, aggregate staged content, artifact counts, active
    submissions, request rate, and concurrency.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
externalDocs:
  description: Open Resource Discovery Specification
  url: https://open-resource-discovery.org/spec-v1/#push-transport
servers:
  - url: https://aggregator.example.org/ord-push
    description: Example base URL communicated by the aggregator.
tags:
  - name: Submissions
    description: Manage transactional publication lifecycles and validation results.
  - name: Documents
    description: Stage standard ORD Documents within a submission.
  - name: ResourceDefinitions
    description: Stage native resource-definition bytes within a submission.
paths:
  /v1/submissions:
    post:
      tags: [Submissions]
      operationId: createSubmission
      summary: Open a submission
      description: |-
        Opens an isolated staging area for one authenticated ORD provider and one publication
        context.
        In `replace` mode, omission removes prior contributions from this ORD provider in the
        publication context.
        An ORD provider can have at most one active (`open`, `validating`, or `failed`) submission
        per publication context. Another creation request for that context is rejected with
        `409 Conflict`, and `activeSubmissionId` in the problem details identifies the active
        submission. A repeated request with the same `Idempotency-Key` returns the original
        submission instead.
        Publication defaults to `merge`; destructive `replace` behavior must be selected explicitly.
        Validation defaults to partial acceptance of valid publication units; strict
        all-or-nothing validation must be selected explicitly.
        The response identifies when the submission expires unless its staged content changes.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubmissionRequest"
            examples:
              merge:
                summary: Merge into the ORD provider's contribution
                value:
                  context:
                    perspective: system-type
              replace:
                summary: Replace the ORD provider's contribution in this context
                value:
                  publicationMode: replace
                  context:
                    perspective: system-type
              strictMerge:
                summary: Require the complete submission to validate
                value:
                  strict: true
                  context:
                    perspective: system-type
      responses:
        "201":
          description: Submission created.
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Submission"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: |-
            Another submission is active for this ORD provider and publication context, or the
            idempotency key was reused with different content. For an active submission,
            `activeSubmissionId` identifies it.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "410":
          $ref: "#/components/responses/Gone"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /v1/submissions/{submissionId}:
    parameters:
      - $ref: "#/components/parameters/SubmissionId"
    get:
      tags: [Submissions]
      operationId: getSubmission
      summary: Get submission state
      responses:
        "200":
          description: Current submission state and issue summary.
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Submission"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Gone"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/UnexpectedError"
    delete:
      tags: [Submissions]
      operationId: discardSubmission
      summary: Discard a submission
      description: |-
        Discards the staged artifacts of an `open` or `failed` submission.
        A submission that is `validating` or `published` cannot be discarded.
      responses:
        "204":
          description: Submission discarded.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Gone"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /v1/submissions/{submissionId}/issues:
    parameters:
      - $ref: "#/components/parameters/SubmissionId"
      - $ref: "#/components/parameters/Cursor"
      - $ref: "#/components/parameters/Limit"
    get:
      tags: [Submissions]
      operationId: listSubmissionIssues
      summary: List submission issues
      description: |-
        Returns errors, warnings, and information messages for the current staged revision.
        Once validation finishes, the paginated collection contains the complete issues
        for that commit attempt.
      responses:
        "200":
          description: Submission issues.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Gone"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /v1/submissions/{submissionId}/documents/{artifactId}:
    parameters:
      - $ref: "#/components/parameters/SubmissionId"
      - $ref: "#/components/parameters/ArtifactId"
    put:
      tags: [Documents]
      operationId: putSubmissionDocument
      summary: Stage or replace an ORD Document
      description: |-
        Stages one standard ORD Document under a submission-local artifact identifier.
        Reusing the identifier replaces the staged document.
        The document is parsed as JSON when staged, while ORD schema and semantic validation
        are performed when the submission is committed.
        This allows one invalid ORD information object to be reported and skipped without
        preventing other valid objects in the document from being published in the default mode.
        Nothing is published before commit processing completes.
        Replacing an artifact in a failed submission opens it for another commit attempt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: An ORD Document to validate against the ORD Document schema at commit time.
      responses:
        "201":
          description: Document artifact created.
        "204":
          description: Document artifact replaced.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Gone"
        "413":
          $ref: "#/components/responses/ContentTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/UnexpectedError"
    delete:
      tags: [Documents]
      operationId: deleteSubmissionDocument
      summary: Remove a staged ORD Document
      responses:
        "204":
          description: Document artifact removed or already absent.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Gone"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /v1/submissions/{submissionId}/resource-definitions/{artifactId}:
    parameters:
      - $ref: "#/components/parameters/SubmissionId"
      - $ref: "#/components/parameters/ArtifactId"
    put:
      tags: [ResourceDefinitions]
      operationId: putSubmissionResourceDefinition
      summary: Stage or replace a resource definition
      description: |-
        Stages native definition bytes and associates them with one ORD resource and the exact
        `resourceDefinitions[].url` value declared by that resource.
        Reusing the artifact identifier replaces the staged bytes and association.
        The request `Content-Type` must equal the media type declared by the resource-definition entry.
        The relationship and media type are validated when the complete submission is committed.
      parameters:
        - $ref: "#/components/parameters/OrdId"
        - $ref: "#/components/parameters/DefinitionUrl"
        - $ref: "#/components/parameters/ContentDigest"
      requestBody:
        required: true
        content:
          "*/*":
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Resource-definition artifact created.
        "204":
          description: Resource-definition artifact replaced.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Gone"
        "413":
          $ref: "#/components/responses/ContentTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/UnexpectedError"
    delete:
      tags: [ResourceDefinitions]
      operationId: deleteSubmissionResourceDefinition
      summary: Remove a staged resource definition
      responses:
        "204":
          description: Resource-definition artifact removed or already absent.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Gone"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /v1/submissions/{submissionId}/commit:
    parameters:
      - $ref: "#/components/parameters/SubmissionId"
    post:
      tags: [Submissions]
      operationId: commitSubmission
      summary: Validate and publish a submission
      description: |-
        Freezes the current staged revision and starts asynchronous validation.
        Every definition declared by a staged ORD resource must have exactly one matching staged
        definition artifact, and every staged definition must match exactly one staged resource by
        ORD ID and the exact declared URL.
        These completeness requirements apply in both publication modes.
        A merge may omit unrelated resources, but a staged resource and all definitions it declares
        form one complete publication unit and cannot be completed from previously published artifacts.
        In the default mode, an error attributable to one publication unit skips that complete unit.
        The aggregator publishes all remaining valid units together and reports every issue.
        An error that prevents publication units from being isolated safely fails the entire commit.
        This includes an error in a staged Package, because ORD resources inherit from their Package.
        A resource whose `partOfPackage` resolves neither to a staged Package nor to a Package
        already published in the same perspective has an error.
        When `strict` is `true`, any error fails the entire commit.
        A replace submission can remove every prior contribution of the ORD provider in the
        publication context by staging at least one valid ORD Document that contains no ORD
        information to retain.
        A staged unit skipped because of an error is not considered omitted for replacement and
        does not remove its previously published contribution.
        Tombstones apply only to contributions from this ORD provider in the submission's
        publication context and require authorization for that contribution.
        Before publishing, the aggregator verifies again that the authenticated push client is
        authorized for the publication context.
        Repeating this request while the same revision is validating returns its current state.
        Committing a `failed` submission without changes validates the same staged revision again,
        for example after authorization or a conflicting contribution outside the submission changed.
        Accepted publication units are applied atomically.
        A submission-wide error, or any error in strict mode, moves the submission to `failed`,
        publishes nothing, and preserves the staged artifacts so the provider can replace or
        remove them and commit again.
        A default-mode commit that has only unit-local errors becomes `published` after applying
        its valid units; skipped units and their errors remain visible in the issues.
      responses:
        "202":
          description: Validation started or is still running.
          headers:
            Location:
              $ref: "#/components/headers/Location"
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Submission"
        "200":
          description: The same staged revision was already published.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Submission"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Gone"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/UnexpectedError"

components:
  parameters:
    SubmissionId:
      name: submissionId
      in: path
      required: true
      description: Aggregator-assigned submission identifier.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    ArtifactId:
      name: artifactId
      in: path
      required: true
      description: Client-assigned identifier that is unique within this submission and artifact collection.
      schema:
        type: string
        pattern: "^[A-Za-z0-9._~-]+$"
        minLength: 1
        maxLength: 128
    OrdId:
      name: ordId
      in: query
      required: true
      description: ORD ID of the resource that declares the resource-definition URL.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    DefinitionUrl:
      name: url
      in: query
      required: true
      description: Exact URI-reference string from the resource definition entry.
      schema:
        type: string
        format: uri-reference
        minLength: 1
    ContentDigest:
      name: Content-Digest
      in: header
      required: false
      description: |-
        Digest of the HTTP message content as defined by RFC 9530.
        It covers the request content after applying any Content-Encoding and before the aggregator
        decodes that content coding. When present, it must contain exactly one sha-256 digest; a
        malformed or mismatching value is rejected with 400 Bad Request. It provides integrity for
        this request and is not a persistent artifact identifier or permission to reuse stored content.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-generated key for safely retrying submission creation. A client that retries creation must reuse the same key for every attempt.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor returned by the previous page.
      schema:
        type: string
        minLength: 1
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of issues to return.
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
  headers:
    Location:
      description: URL of the submission status resource.
      schema:
        type: string
        format: uri-reference
    RetryAfter:
      description: |-
        Earliest time at which the client should make a follow-up request, using either delay-seconds
        or an HTTP-date as defined by RFC 9110. On a 429 response, a client that retries must not do
        so before this time. On a successful response for a validating submission, it guides polling.
      schema:
        type: string
        minLength: 1
      examples:
        delaySeconds:
          value: "5"
        httpDate:
          value: Fri, 25 Sep 2026 12:00:00 GMT
  responses:
    BadRequest:
      description: The request is malformed or has an invalid parameter combination.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: The ORD provider is not authorized for the operation or publication context.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: The submission identifier is unknown or is not visible to this ORD provider. This also applies after the aggregator removes the marker of an expired submission or of a published submission whose retention period ended.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: The operation conflicts with the current submission state or reuses an idempotency key with different content.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Gone:
      description: |-
        The submission is no longer available. The aggregator returns this while it retains a marker
        for the submission, either after an `open` or `failed` submission expired without being
        published, or after the retention period of a `published` submission ended.
        The `outcome` member of the problem details states which case applies.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ContentTooLarge:
      description: The encoded request body, decoded artifact, or aggregate staged content exceeds a limit documented by the aggregator.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnsupportedMediaType:
      description: The request media type or content encoding is unsupported.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableContent:
      description: The artifact cannot be admitted, a documented per-submission artifact-count limit would be exceeded, or the submission has no staged ORD Documents.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RateLimited:
      description: The ORD provider exceeded a rate or concurrency limit and may retry later.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnexpectedError:
      description: An unexpected request or server failure.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    CreateSubmissionRequest:
      type: object
      required: [context]
      additionalProperties: false
      properties:
        publicationMode:
          type: string
          description: Whether omission removes prior contributions from this ORD provider in the publication context. Defaults to the non-destructive `merge` mode.
          enum: [replace, merge]
          default: merge
        strict:
          type: boolean
          default: false
          description: |-
            Whether any validation error prevents the entire submission from being published.
            When `false`, errors attributable to one publication unit skip that complete unit and
            all other valid units are published.
            Submission-wide errors always fail the commit.
        context:
          $ref: "#/components/schemas/PublicationContext"
    PublicationContext:
      type: object
      description: |-
        Context that must resolve to exactly one authorized publication target.
        `systemVersion` applies only to `system-version`, and `systemInstanceId` applies only to
        `system-instance`.
      required: [perspective]
      additionalProperties: false
      properties:
        perspective:
          type: string
          description: |-
            Explicitly selects the submission's perspective and MUST be provided even when the
            authenticated credential is restricted to one perspective. All staged ORD Documents
            MUST describe this perspective and the same publication target; a submission MUST NOT
            mix perspectives or targets.
          enum: [system-type, system-version, system-instance, system-independent]
        systemVersion:
          type: string
          minLength: 1
          description: Required for `system-version` unless the credential identifies exactly one version.
        systemInstanceId:
          type: string
          minLength: 1
          maxLength: 255
          description: Aggregator-issued identifier required for `system-instance` unless the credential identifies exactly one instance.
    Submission:
      type: object
      required:
        - id
        - status
        - publicationMode
        - strict
        - context
        - expiresAt
        - artifactCounts
        - issueCounts
      additionalProperties: true
      properties:
        id:
          type: string
        status:
          $ref: "#/components/schemas/SubmissionStatus"
        publicationMode:
          type: string
          enum: [replace, merge]
        strict:
          type: boolean
          description: Whether validation errors prevent publication of the entire submission.
        context:
          $ref: "#/components/schemas/PublicationContext"
        expiresAt:
          type: string
          format: date-time
          description: |-
            For an `open` or `failed` submission, the current inactivity deadline after which the submission and its staged artifacts are discarded.
            Successful staging changes extend this value; status and issue retrieval do not.
            Expiry is suspended during validation, and a failed validation receives a new inactivity deadline.
            Aggregators define and communicate the timeout, with 15 minutes as the recommended default.
            For a `published` submission, the end of its retention period, after which its status and issues are no longer available.
            Aggregators choose and communicate the retention period, with at least 24 hours recommended.
        artifactCounts:
          $ref: "#/components/schemas/ArtifactCounts"
        issueCounts:
          $ref: "#/components/schemas/IssueCounts"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        publishedAt:
          type: string
          format: date-time
    SubmissionStatus:
      type: string
      description: |-
        `open` accepts artifact changes.
        `validating` is an immutable staged revision undergoing commit validation.
        `failed` retains artifacts for correction after a submission-wide error or any error in strict mode.
        `published` is terminal and indicates that commit processing completed and all accepted publication units were applied atomically.
        A published non-strict submission can have errors for skipped publication units.
      enum: [open, validating, failed, published]
    ArtifactCounts:
      type: object
      required: [documents, resourceDefinitions]
      additionalProperties: false
      properties:
        documents:
          type: integer
          minimum: 0
        resourceDefinitions:
          type: integer
          minimum: 0
    IssueCounts:
      type: object
      required: [error, warning, information]
      additionalProperties: false
      properties:
        error:
          type: integer
          minimum: 0
        warning:
          type: integer
          minimum: 0
        information:
          type: integer
          minimum: 0
    IssuePage:
      type: object
      required: [submissionStatus, items]
      additionalProperties: false
      properties:
        submissionStatus:
          $ref: "#/components/schemas/SubmissionStatus"
        items:
          type: array
          items:
            $ref: "#/components/schemas/ValidationIssue"
        nextCursor:
          type: string
    ValidationIssue:
      type: object
      required: [severity, message]
      additionalProperties: true
      properties:
        severity:
          type: string
          enum: [error, warning, information]
        code:
          type: string
        message:
          type: string
        artifactKind:
          type: string
          enum: [document, resource-definition, submission]
        artifactId:
          type: string
          description: |-
            Identifier the provider assigned to the staged artifact the issue applies to.
            Present for every unit-local issue; omitted only when `artifactKind` is `submission`.
        ordId:
          type: string
          description: |-
            ORD ID of the publication unit the issue applies to, when that unit is a resource or
            taxonomy object. Exactly one of `ordId`, `groupId`, or `groupTypeId` identifies the unit
            of a unit-local issue.
        groupId:
          type: string
          description: Group ID of the publication unit the issue applies to, when that unit is a Group.
        groupTypeId:
          type: string
          description: Group Type ID of the publication unit the issue applies to, when that unit is a Group Type.
        definitionUrl:
          type: string
          description: |-
            Exact declared `resourceDefinitions[].url` of the resource definition the issue applies to.
            MUST be present when the issue is about a resource definition, so that two resources
            referencing the same URL produce distinguishable issues.
        jsonPointer:
          type: string
          description: Optional JSON Pointer deep-linking to the exact location of the issue within the staged artifact.
    Problem:
      type: object
      description: Problem Details object as defined by RFC 9457.
      required: [type, title]
      additionalProperties: true
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        outcome:
          type: string
          enum: [expired, published]
          description: |-
            Present in `410 Gone` responses.
            `expired` means the submission was discarded after inactivity without being published.
            `published` means the submission was published and its retention period ended; its published ORD information is unaffected.
        activeSubmissionId:
          type: string
          description: Identifier of the active submission that prevents creating another submission for the same ORD provider and publication context.
        issues:
          type: array
          items:
            $ref: "#/components/schemas/ValidationIssue"
